    <form action="subscribe.php" method="post">
        <div class="card mt-3">
            <div class="card-header">
                Subscription Information
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="mb-3 col-md-4">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3 col-md-4">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3 col-md-4">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
                            <label class="form-check-label" for="genderMale">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                            <label class="form-check-label" for="genderFemale">Female</label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-md-4">
                        <label for="birthdate" class="form-label">Birthday</label>
                        <input type="date" class="form-control" id="birthdate" name="birthdate">
                    </div>
                    <div class="mb-3 col-md-4">
                        <label for="frequency" class="form-label">Newsletter Frequency</label>
                        <select class="form-select" id="frequency" name="frequency" required>
                            <option value="daily">Daily Updates</option>
                            <option value="weekly">Weekly Updates</option>
                            <option value="monthly">Monthly Updates</option>
                        </select>
                    </div>
                    <div class="mb-3 col-md-4">
                        <label class="form-label d-block">Interested Topics</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="topicNews" name="topics[]" value="news">
                            <label class="form-check-label" for="topicNews">News</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="topicOffers" name="topics[]" value="offers">
                            <label class="form-check-label" for="topicOffers">Special Offers</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="topicEvents" name="topics[]" value="events">
                            <label class="form-check-label" for="topicEvents">Event Updates</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Additional Comments or Suggestions</label>
                    <textarea class="form-control" id="message" name="message" rows="3" placeholder="We'd love to hear from you..."></textarea>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label class="form-check-label" for="agreeTerms">
                        I agree to the <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>.
                    </label>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Subscribe</button>
                </div>
            </div>
        </div>
    </form>
